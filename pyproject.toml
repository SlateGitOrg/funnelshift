[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "funnelshift"
version = "0.1.0"
description = "Product funnel SQL with explicit step-order and window rules, checked against a brute-force oracle, plus a mix-versus-rate decomposition of conversion change."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "funnelshift contributors" }]
keywords = ["sql-analysis", "duckdb", "product-analytics", "funnel-analysis", "simpsons-paradox"]
dependencies = [
  "duckdb>=1.1",
  "jinja2>=3.1",
  "numpy>=1.26",
  "pandas>=2.2",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.100", "ruff>=0.6"]

[project.scripts]
funnelshift = "funnelshift.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/funnelshift"]

[tool.hatch.build.targets.wheel.force-include]
"sql" = "funnelshift/sql"
"funnels" = "funnelshift/funnels"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
